<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Antiguedad ERNE</title>
    <link rel="icon" type="image/x-icon" href="ep.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --bg-main: #020617;
            --bg-card: #0f172a;
            --erne-green: #22c55e;
            --erne-blue: #1d4ed8;
            --erne-light: #e5e7eb;
            --erne-muted: #9ca3af;
            --danger: #f97373;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 18px;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b 0, #020617 45%, #000 100%);
            color: var(--erne-light);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: linear-gradient(145deg, rgba(15,23,42,0.95), rgba(15,23,42,0.88));
            border-radius: 18px;
            border: 1px solid rgba(148,163,184,0.4);
            box-shadow:
                0 0 0 1px rgba(15,23,42,0.9),
                0 20px 60px rgba(0,0,0,0.8);
            padding: 20px 18px 22px;
            backdrop-filter: blur(18px);
        }

        @media (min-width: 640px) {
            .card {
                padding: 24px 26px 26px;
            }
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-circle {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 2px solid rgba(74,222,128,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 0, #4ade80, #16a34a 40%, #052e16 100%);
            box-shadow: 0 0 22px rgba(34,197,94,0.8);
            font-weight: 700;
            font-size: 20px;
        }

        .brand-text-main {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand-text-sub {
            font-size: 12px;
            color: var(--erne-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(148,163,184,0.6);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--erne-muted);
            background: radial-gradient(circle at top left, rgba(96,165,250,0.35), transparent 55%);
        }

        .main-title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .main-subtitle {
            font-size: 16px;
            color: var(--erne-muted);
            margin-bottom: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.8fr) minmax(0, 2.2fr);
            gap: 18px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        .panel {
            background: radial-gradient(circle at top left, rgba(37,99,235,0.25), rgba(15,23,42,0.96));
            border-radius: 16px;
            border: 1px solid rgba(37,99,235,0.4);
            padding: 14px 14px 16px;
            min-height: 320px;
        }

        .panel-secondary {
            background: radial-gradient(circle at top left, rgba(34,197,94,0.25), rgba(15,23,42,0.96));
            border: 1px solid rgba(34,197,94,0.45);
        }

        .panel-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--erne-muted);
            margin-bottom: 10px;
        }

        label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--erne-muted);
            margin-bottom: 4px;
            display: block;
        }

        select {
            width: 100%;
            padding: 12px 13px;
            border-radius: 11px;
            border: 1px solid rgba(148,163,184,0.7);
            background: rgba(15,23,42,0.92);
            color: var(--erne-light);
            font-size: 18px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, #9ca3af 50%),
                              linear-gradient(135deg, #9ca3af 50%, transparent 50%);
            background-position: calc(100% - 18px) calc(50% - 4px), calc(100% - 13px) calc(50% - 4px);
            background-size: 7px 7px, 7px 7px;
            background-repeat: no-repeat;
        }

        select:focus {
            border-color: rgba(59,130,246,0.9);
            box-shadow: 0 0 0 1px rgba(59,130,246,0.75);
            background-color: rgba(15,23,42,1);
        }

        .helper {
            font-size: 12px;
            color: var(--erne-muted);
            margin-top: 6px;
        }

        .proximo-box {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: linear-gradient(120deg, rgba(34,197,94,0.14), rgba(15,23,42,0.98));
            border: 1px solid rgba(34,197,94,0.7);
        }

        .proximo-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--erne-muted);
            margin-bottom: 4px;
        }

        .proximo-value {
            font-size: 18px;
            font-weight: 600;
        }

        .proximo-note {
            font-size: 11px;
            color: var(--erne-muted);
            margin-top: 2px;
        }

        .data-row {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.6fr);
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(51,65,85,0.9);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-label {
            font-size: 13px;
            color: var(--erne-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .data-value {
            font-size: 18px;
            font-weight: 600;
        }

        .data-value.emphasis {
            color: var(--erne-green);
        }

        /* dias antiguedad y nivel carrera: grandes con brillo */
        .data-value-grande {
            font-size: 24px;
            font-weight: 800;
            color: #4ade80;
            letter-spacing: 0.03em;
            white-space: nowrap;
            animation: importe-glow-pulse 2s ease-in-out infinite;
        }

        .data-value-grande.sin-valor {
            animation: none;
            color: var(--erne-muted);
            font-size: 18px;
            font-weight: 600;
            text-shadow: none;
            opacity: 0.6;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(15,23,42,0.9);
            border: 1px solid rgba(148,163,184,0.7);
            font-size: 11px;
            color: var(--erne-muted);
            margin-top: 10px;
        }

        .pill-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: var(--erne-green);
            box-shadow: 0 0 8px rgba(34,197,94,0.9);
        }

        .footer-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .status-text {
            font-size: 12px;
            color: var(--erne-muted);
        }

        .status-text strong {
            color: var(--erne-light);
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            position: relative;
            border: none;
            border-radius: 999px;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
        }

        .btn span.icon {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            background: rgba(15,23,42,0.96);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .btn-pdf {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #020617;
            box-shadow:
                0 10px 26px rgba(22,163,74,0.6),
                0 0 0 1px rgba(21,128,61,0.9);
        }

        .btn-clear {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #eff6ff;
            box-shadow:
                0 10px 22px rgba(59,130,246,0.4);
        }

        .btn-web {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #eff6ff;
            box-shadow:
                0 10px 22px rgba(59,130,246,0.4);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        .error-text {
            font-size: 12px;
            color: var(--danger);
            margin-top: 6px;
            display: none;
        }

        .error-visible {
            display: block;
        }

        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .footer-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .status-text {
                text-align: left;
            }
            .btn-group {
                justify-content: flex-start;
            }
        }

        /* === IMPORTE GRANDE: más grande, brillo y parpadeo === */
        @keyframes importe-glow-pulse {
            0%   { text-shadow: 0 0 8px rgba(34,197,94,0.6),  0 0 20px rgba(34,197,94,0.3);  opacity: 1; }
            50%  { text-shadow: 0 0 22px rgba(74,222,128,1),  0 0 48px rgba(34,197,94,0.7),  0 0 80px rgba(34,197,94,0.3); opacity: 0.82; }
            100% { text-shadow: 0 0 8px rgba(34,197,94,0.6),  0 0 20px rgba(34,197,94,0.3);  opacity: 1; }
        }

        .importe-grande {
            font-size: 24px;
            font-weight: 800;
            color: #4ade80;
            letter-spacing: 0.03em;
            white-space: nowrap;
            animation: importe-glow-pulse 2s ease-in-out infinite;
        }

        /* cuando muestra placeholder "--" no parpadea */
        .importe-grande.sin-valor {
            animation: none;
            color: var(--erne-muted);
            font-size: 18px;
            font-weight: 600;
            text-shadow: none;
            opacity: 0.6;
        }
        /* === FIN IMPORTE === */
    </style>
</head>

    function fechaDesdeTexto(fecha) {
        const [dia, mes, anio] = fecha.split("/").map(Number);
        return new Date(anio, mes - 1, dia);
    }

    // Consulta fijada al cierre de 2027: el nivel mostrado es el alcanzado a 31/12/2027.
    const FECHA_REFERENCIA = new Date(2027, 11, 31);

    function nivelEnFecha(promo, fechaReferencia = FECHA_REFERENCIA) {
        const fechas = tablaN[promo] || [];
        return fechas.filter(fecha => fechaDesdeTexto(fecha) <= fechaReferencia).length;
    }

    function proximoEncuadramiento(promo, fechaReferencia = FECHA_REFERENCIA) {
        const fechas = tablaN[promo] || [];
        return fechas.find(fecha => fechaDesdeTexto(fecha) > fechaReferencia) || "Nivel máximo";
    }

    const importesNivel = {
        1: "1.588,31 €",
        2: "2.199,19 €",
        3: "3055,01 €",
        4: "4.276,68 €"
    };

    const selPromocion = document.getElementById("promocionSelect");
    const periodoEl = document.getElementById("periodo");
    const diasAntiguedadEl = document.getElementById("diasAntiguedad");
    const nivelCarreraEl = document.getElementById("nivelCarrera");
    const importeNivelEl = document.getElementById("importeNivel");
    const proximoEl = document.getElementById("proximoEncuadramiento");
    const errorMsgEl = document.getElementById("errorMsg");
    const btnPdf = document.getElementById("btnPdf");
    const btnClear = document.getElementById("btnClear");
    const btnWeb = document.getElementById("btnWeb");

    function formatearPeriodo(datos) {
        if (!datos) return "--";
        if (datos.entrada && datos.salida) {
            return datos.entrada + " - " + datos.salida;
        }
        if (datos.entrada && !datos.salida) {
            return datos.entrada + " - ";
        }
        return "--";
    }

    function setImporte(valor) {
        if (!valor || valor === "-- €") {
            importeNivelEl.textContent = "-- €";
            importeNivelEl.classList.add("sin-valor");
        } else {
            importeNivelEl.textContent = valor;
            importeNivelEl.classList.remove("sin-valor");
        }
    }

    function setGrande(el, valor, sinValorTexto) {
        if (valor === null || valor === undefined || valor === "" || valor === "--") {
            el.textContent = sinValorTexto;
            el.classList.add("sin-valor");
        } else {
            el.textContent = String(valor);
            el.classList.remove("sin-valor");
        }
    }

    function actualizarVista() {
        const promo = selPromocion.value;

        if (!promo) {
            periodoEl.textContent = "--";
            setGrande(diasAntiguedadEl, null, "--");
            setGrande(nivelCarreraEl, null, "--");
            setImporte("-- €");
            proximoEl.textContent = "--";
            errorMsgEl.classList.remove("error-visible");
            return;
        }

        const datos = tabla1[promo];
        const nivelCalculado = nivelEnFecha(promo);
        const proximo = proximoEncuadramiento(promo);

        if (!datos) {
            periodoEl.textContent = "--";
            setGrande(diasAntiguedadEl, null, "--");
            setGrande(nivelCarreraEl, null, "--");
            setImporte("-- €");
            proximoEl.textContent = proximo;
            errorMsgEl.classList.add("error-visible");
            return;
        }

        errorMsgEl.classList.remove("error-visible");

        periodoEl.textContent = formatearPeriodo(datos);
        setGrande(diasAntiguedadEl, typeof datos.dias === "number" ? datos.dias : null, "--");
        setGrande(nivelCarreraEl, nivelCalculado, "--");
        setImporte(importesNivel[nivelCalculado] || "-- €");

        proximoEl.textContent = proximo || "Nivel Maximo";
    }

    selPromocion.addEventListener("change", actualizarVista);

    btnClear.addEventListener("click", function () {
        selPromocion.selectedIndex = 0;
        periodoEl.textContent = "--";
        setGrande(diasAntiguedadEl, null, "--");
        setGrande(nivelCarreraEl, null, "--");
        setImporte("-- €");
        proximoEl.textContent = "--";
        errorMsgEl.classList.remove("error-visible");
    });

    btnWeb.addEventListener("click", function () {
        window.location.href = "https://www.erne.es";
    });

    btnPdf.addEventListener("click", function () {
        const promo = selPromocion.value;
        if (!promo) {
            errorMsgEl.textContent = "Selecciona primero una promocion para generar el informe PDF.";
            errorMsgEl.classList.add("error-visible");
            return;
        }

        const datos = tabla1[promo];
        const nivelCalculado = nivelEnFecha(promo);
        const proximo = proximoEncuadramiento(promo);

        if (!datos) {
            errorMsgEl.textContent = "No hay datos de antiguedad para la promocion seleccionada.";
            errorMsgEl.classList.add("error-visible");
            return;
        }

        errorMsgEl.classList.remove("error-visible");

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFillColor(6, 11, 32);
        doc.rect(0, 0, 210, 25, "F");

        doc.setTextColor(226, 232, 240);
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.text("ERNE - Informe de antiguedad (niveles a 31/12/2027)", 14, 16);

        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("Promocion " + promo, 14, 22);

        let y = 40;
        doc.setTextColor(15, 23, 42);
        doc.setFontSize(12);
        doc.setFont("helvetica", "bold");
        doc.text("Resumen de datos", 14, y);
        y += 8;

        doc.setFontSize(11);
        doc.setFont("helvetica", "normal");
        doc.text("Periodo entrada - salida: " + formatearPeriodo(datos), 14, y);
        y += 7;
        doc.text(
            "Dias por antiguedad: " +
            (typeof datos.dias === "number" ? String(datos.dias) : "0"),
            14, y
        );
        y += 7;
        doc.text(
            "Nivel carrera profesional: " +
            String(nivelCalculado),
            14, y
        );
        y += 14;

        doc.setFont("helvetica", "bold");
        doc.text("Proximo encuadramiento", 14, y);
        y += 8;

        doc.setFont("helvetica", "normal");
        doc.text("Fecha encuadramiento: " + proximo, 14, y);
        y += 14;

        doc.setFontSize(9);
        doc.setTextColor(100, 116, 139);
        doc.text("Informe generado automaticamente por ERNE.", 14, y);

        doc.save("informe_antiguedad_promocion_" + promo + ".pdf");
    });

    actualizarVista();
</script>
</body>
</html>
