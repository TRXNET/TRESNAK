<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso privado</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #10243a, #1c5274);
    }
    .login {
      width: 100%; max-width: 390px; padding: 34px;
      background: #fff; border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 8px; color: #17354d; font-size: 25px; }
    p { margin: 0 0 25px; color: #647483; }
    label { display: block; margin: 16px 0 7px; color: #263b4c; font-weight: 700; }
    input {
      width: 100%; padding: 12px 13px; border: 1px solid #cbd5dc;
      border-radius: 8px; font-size: 16px;
    }
    input:focus { outline: 2px solid #4b9ac2; border-color: transparent; }
    button {
      width: 100%; margin-top: 24px; padding: 13px;
      border: 0; border-radius: 8px; background: #17658d;
      color: white; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #104d6d; }
    #mensaje { min-height: 20px; margin: 15px 0 0; color: #b42318; font-size: 14px; }
  </style>
</head>
<body>
  <main class="login">
    <h1>Acceso privado</h1>
    <p>Introduce tu usuario y contraseña para continuar.</p>

    <form id="formulario">
      <label for="usuario">Nombre de usuario</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" required>

      <label for="contrasena">Contraseña</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input id="contrasena" name="contrasena" type="password"
               autocomplete="current-password" required>
        <button type="button" id="verClave"
                style="width:auto; min-width:92px; margin-top:0; padding:12px 14px;"
                aria-pressed="false">Ver</button>
      </div>

      <button type="submit">Entrar</button>
      <div id="mensaje" role="alert" aria-live="polite"></div>
    </form>
  </main>

  <script>
    /*
      USUARIOS AUTORIZADOS
      Añade, modifica o elimina usuarios en esta lista.
      Formato: "Nombre": "contraseña"
    */
    const usuarios = {
      "aitor": "otxoko",
      "raul": "bitxo",
      "txemi": "gar"
    };

    const campoClave = document.getElementById("contrasena");
    const botonVer = document.getElementById("verClave");

    botonVer.addEventListener("click", function () {
      const mostrar = campoClave.type === "password";
      campoClave.type = mostrar ? "text" : "password";
      botonVer.textContent = mostrar ? "Ocultar" : "Ver";
      botonVer.setAttribute("aria-pressed", String(mostrar));
    });

    document.getElementById("formulario").addEventListener("submit", function (evento) {
      evento.preventDefault();

      const nombre = document.getElementById("usuario").value.trim().toLowerCase();
      const clave = document.getElementById("contrasena").value;
      const mensaje = document.getElementById("mensaje");

      if (Object.prototype.hasOwnProperty.call(usuarios, nombre) &&
          usuarios[nombre] === clave) {
        // La página index.html debe estar en la misma carpeta que este archivo.
        window.location.href = "index.html";
      } else {
        mensaje.textContent = "Nombre de usuario o contraseña incorrectos.";
        document.getElementById("contrasena").value = "";
        document.getElementById("contrasena").focus();
      }
    });
  </script>
</body>
</html>
