<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Er.N.E. - Calendarios</title>
  <link rel="icon" type="image/x-icon" href="ep.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background: linear-gradient(180deg,#0b1220 0%,#0f1b33 45%,#102a5c 100%);
      color:#e6f0ff;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding: max(18px, env(safe-area-inset-top)) 10px max(28px, env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    .wrap{width:100%;max-width:820px}
    .panel{
      background:
        radial-gradient(1200px circle at -10% -20%, rgba(77,163,255,0.12), transparent 50%),
        linear-gradient(160deg, rgba(8,36,80,0.96), rgba(3,18,40,0.92));
      border:1px solid rgba(255,255,255,0.12);
      border-radius:18px;
      box-shadow:0 18px 40px rgba(0,0,0,0.6);
      padding:16px 14px;
      position:relative;
      overflow:hidden;
    }
    .panel::after{
      content:"Er.N.E.";
      position:absolute;right:-10px;top:10px;
      font-weight:800;letter-spacing:0.22em;font-size:64px;
      color:rgba(255,255,255,0.04);transform:rotate(90deg);
      pointer-events:none;user-select:none;
    }
    .brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      margin-top:2px;
    }
    h1{
      margin:0;
      font-size:1.35rem;
      text-align:center;
    }
    .sub{
      text-align:center;
      font-size:.95rem;
      color:#bcd4ff;
      margin:6px 0 14px;
    }

    .cards{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:10px;
    }
    .card{
      text-decoration:none;
      color:inherit;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.14);
      background: linear-gradient(180deg, rgba(14,35,76,.85), rgba(7,21,48,.92));
      padding:14px;
      position:relative;
      overflow:hidden;
      min-height:128px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition:transform .12s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .card:active{transform:translateY(0)}

    .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:800;
      letter-spacing:.02em;
      font-size:.95rem;
    }
    .dot{
      width:12px;height:12px;border-radius:4px;
      border:1px solid rgba(255,255,255,0.35);
      display:inline-block;
    }

    .title{
      font-size:1.1rem;
      font-weight:900;
      margin:10px 0 6px;
      line-height:1.2;
    }
    .desc{
      font-size:.92rem;
      color:#cfe0ff;
      line-height:1.35;
      margin:0;
    }

    .go{
      margin-top:12px;
      display:flex;
      justify-content:flex-end;
      font-weight:900;
      color:#e6f0ff;
      opacity:.95;
    }

    .calpro .dot{background:#93c5fd}   /* azul */
    .flex .dot{background:#f59e0b}     /* naranja */

    .tiny{
      margin-top:14px;
      text-align:center;
      color:#bcd4ff;
      font-size:.9rem;
    }

    @media (max-width:520px){
      .panel::after{font-size:52px}
      .cards{grid-template-columns:1fr}
      .card{min-height:120px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">

      <div class="brand">
        <img src="euskalpolizia txiki.jpg" width="142" height="57" alt="Euskal Polizia">
        <h1>Calendarios</h1>
      </div>
      <div class="sub">Elige qué tipo de calendario quieres abrir</div>

      <div class="cards">
        <a class="card calpro" href="proteccion.html">
          <div class="tag"><span class="dot"></span>Turnos</div>
          <div>
            <div class="title">Calendario de proteccion ciudadana</div>
            <p class="desc">Calendario de 5 semanas</p>
          </div>
          <div class="go">Entrar →</div>
        </a>

        <a class="card flex" href="flexible.html">
          <div class="tag"><span class="dot"></span>Flexible</div>
          <div>
            <div class="title">Calendario flexible</div>
            <p class="desc">Calendario 5-2-7-7 (SITC, VD-VG, OLI...)</p>
          </div>
          <div class="go">Entrar →</div>
        </a>
      </div>

      <div class="tiny">Er.N.E. · Acceso rápido</div>
    </div>
  </div>
</body>
</html>
