<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agenda de juicios</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  *{box-sizing:border-box;}

  body{
    font-family:system-ui,arial;
    background:#0f172a;
    color:#e5e7eb;
    margin:0;
    padding:12px;
  }

  h1{
    font-size:24px;
    margin:0 0 16px 0;
    font-weight:800;
  }

  .box{
    background:#1e293b;
    border-radius:14px;
    padding:16px;
    margin-bottom:22px;
    border:1px solid rgba(255,255,255,0.08);
  }

  .box h2{
    font-size:20px;
    font-weight:800;
    margin-bottom:18px;
    text-transform:uppercase;
    letter-spacing:0.6px;
  }

  label{
    font-size:13px;
    color:#9ca3af;
    text-transform:uppercase;
    margin-bottom:4px;
    display:block;
  }

  input,textarea{
    width:90%;
    margin:0 auto 12px auto;
    display:block;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid #475569;
    background:#0f172a;
    color:#e5e7eb;
    font-size:14px;
  }

  textarea{
    min-height:80px;
    resize:vertical;
  }

  input[type="file"]{
    border:none;
    background:transparent;
    padding:2px 0;
  }

  button{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:none;
    font-weight:700;
    cursor:pointer;
    margin-bottom:8px;
    color:#ffffff;
  }

  .save{background:#22c55e;}
  .new{background:#6b7280;}
  .load{background:#3b82f6;}
  .print{background:#0ea5e9;}

  /* ===== JUICIOS GUARDADOS ===== */

  .item{
    background:#334155;
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:10px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid rgba(255,255,255,0.06);
    transition:0.15s;
    gap:10px;
  }

  .item:hover{
    background:#41506a;
  }

  .item-left{
    flex:1;
    display:flex;
    flex-direction:column;
  }

  .item-title{
    font-size:14px;
    font-weight:600;
    color:#ffffff;
    line-height:1.25;
    letter-spacing:0.2px;
  }

  .item-sub{
    font-size:11px;
    color:#cbd5f5;
    opacity:0.85;
    line-height:1.3;
  }

  /* Icono X rojo para borrar */
  .btn-mini{
    background:transparent;
    color:#ef4444;
    border:1px solid #ef4444;
    padding:0;
    width:18px;
    height:18px;
    font-size:11px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
    line-height:18px;
    text-align:center;
  }

  .btn-mini:hover{
    background:#ef4444;
    color:#ffffff;
  }

  /* Boton VOLVER (Hasiera) en rojo */
  .volver{
    background:#ef4444;
    color:#fef2f2;
    border:none;
    padding:11px;
    border-radius:10px;
    font-weight:600;
    width:100%;
    margin-top:10px;
  }

  @media(max-width:480px){
    .box{padding:14px;}
    input,textarea{width:94%;}
  }
.Estilo2 {font-size: 10px}
</style>
</head>

<body><br>

<img src="euskalpolizia txiki.jpg" width="142" height="57" alt="Euskal Polizia">
<h1>Agenda de juicios</h1>

<!-- FORMULARIO -->
<div class="box">
  <h2>Nuevo juicio</h2>

  <label>Fecha del juicio</label>
  <input type="date" id="fechaJuicio">

  <label>Hora</label>
  <input type="time" id="horaJuicio">

  <label>Lugar / sala</label>
  <input id="lugar" placeholder="Sala 2, Palacio de Justicia">

  <label>Notas</label>
  <textarea id="notas" placeholder="Recordatorio, documentacion a llevar, etc."></textarea>

  <label>Adjuntar archivo pequeño (opcional)</label>
  <input type="file" id="adjunto" accept="image/*,application/pdf">

  <button class="save" onClick="guardarJuicio()">Guardar juicio</button>
 
</div>

<!-- LISTA -->
<div class="box">
  <h2>Juicios proximos</h2>
  <div id="listaJuicios"></div>
 
</div>

<!-- GESTION -->
<div class="box">
  <span class="Estilo2">Es aconsejable respaldar tus datos en otro dispositivo.</span>
  <h2>Gestion</h2>
  <button class="print" onClick="imprimirJuicios()">Imprimir juicios</button>
</div>


<script>
let claveActual = null;

/* Limpia texto para evitar simbolos raros en la salida */
function limpiarTexto(txt){
  return (txt||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")   // tildes
    .replace(/[^\w\s\-:\.]/g,"")      // simbolos raros
    .trim();
}

function generarClave(fecha, texto){
  return "juicio_" + fecha + "_" + (texto||"").toLowerCase().split(/\s+/)[0];
}

function limpiarFormulario(){
  document.getElementById("fechaJuicio").value = "";
  document.getElementById("horaJuicio").value = "";
  document.getElementById("lugar").value = "";
  document.getElementById("notas").value = "";
  document.getElementById("adjunto").value = "";
  claveActual = null;
}

function guardarJuicio(){
  const datos = {
    fecha: document.getElementById("fechaJuicio").value,
    hora: document.getElementById("horaJuicio").value,
    lugar: document.getElementById("lugar").value.trim(),
    notas: document.getElementById("notas").value.trim()
  };

  if(!datos.fecha){
    alert("Pon la fecha del juicio.");
    return;
  }

  const file = document.getElementById("adjunto").files[0];

  function guardarEnLocal(d){
    if(!claveActual){
      const k = generarClave(d.fecha, d.lugar || d.notas);
      localStorage.setItem(k, JSON.stringify(d));
      claveActual = k;
    } else {
      localStorage.setItem(claveActual, JSON.stringify(d));
    }
    limpiarFormulario();
    cargarLista();
  }

  if(file){
    const reader = new FileReader();
    reader.onload = e=>{
      const d = Object.assign({}, datos, {
        adjuntoNombre: file.name,
        adjuntoTipo: file.type,
        adjuntoData: e.target.result
      });
      guardarEnLocal(d);
    };
    reader.readAsDataURL(file);
  } else {
    if(claveActual){
      const viejo = JSON.parse(localStorage.getItem(claveActual) || "{}");
      const d = Object.assign({}, viejo, datos);
      guardarEnLocal(d);
    } else {
      guardarEnLocal(datos);
    }
  }
}

function cargarLista(){
  const cont = document.getElementById("listaJuicios");
  cont.innerHTML = "";

  const juicios = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith("juicio_")){
      const d = JSON.parse(localStorage.getItem(k));
      if(d) juicios.push({clave:k, datos:d});
    }
  }

  juicios.sort((a,b)=>{
    const fa = (a.datos.fecha||"") + (a.datos.hora||"");
    const fb = (b.datos.fecha||"") + (b.datos.hora||"");
    return fa < fb ? -1 : fa > fb ? 1 : 0;
  });

  if(juicios.length === 0){
    cont.innerHTML = "<p style='font-size:13px;color:#9ca3af;'>No hay juicios guardados.</p>";
    return;
  }

  juicios.forEach(item=>{
    const d = item.datos;

    const fila = document.createElement("div");
    fila.className = "item";

    // clic en el banner abre detalle
    fila.onclick = ()=>verJuicio(item.clave);

    const left = document.createElement("div");
    left.className = "item-left";

    const titulo = document.createElement("div");
    titulo.className = "item-title";
    titulo.textContent =
      limpiarTexto(d.fecha||"") + " " +
      limpiarTexto(d.hora||"") + " - " +
      limpiarTexto(d.lugar||"");

    const sub = document.createElement("div");
    sub.className = "item-sub";
    sub.textContent = limpiarTexto(d.notas||"").substring(0,60);

    left.appendChild(titulo);
    left.appendChild(sub);

    // Icono X para borrar
    const btn = document.createElement("button");
    btn.className = "btn-mini";
    btn.textContent = "X";
    btn.onclick = (e)=>{
      e.stopPropagation();
      if(confirm("Borrar este juicio?")){
        localStorage.removeItem(item.clave);
        cargarLista();
      }
    };

    fila.appendChild(left);
    fila.appendChild(btn);
    cont.appendChild(fila);
  });
}

/* Mostrar detalle + adjunto (imagen o enlace) */
function verJuicio(clave){
  const d = JSON.parse(localStorage.getItem(clave));
  if(!d) return;

  let adjuntoHtml = "";
  if(d.adjuntoData){
    if(d.adjuntoTipo && d.adjuntoTipo.startsWith("image/")){
      adjuntoHtml = `
        <h2>Adjunto</h2>
        <p><strong>Archivo:</strong> ${limpiarTexto(d.adjuntoNombre || "")}</p>
        <img src="${d.adjuntoData}" alt="Adjunto" style="max-width:100%;height:auto;border-radius:12px;border:1px solid #e5e7eb;margin-top:8px;">
      `;
    } else {
      adjuntoHtml = `
        <h2>Adjunto</h2>
        <p><strong>Archivo:</strong> ${limpiarTexto(d.adjuntoNombre || "")}</p>
        <p>
          <a href="${d.adjuntoData}" target="_blank" style="display:inline-block;margin-top:6px;padding:8px 14px;border-radius:999px;background:#0f172a;color:#ffffff;text-decoration:none;font-weight:600;">
            Abrir / descargar adjunto
          </a>
        </p>
      `;
    }
  }

  const vent = window.open("","_blank");
  vent.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Detalle juicio</title>
      <style>
        body{
          font-family:system-ui,arial;
          background:#f3f4f6;
          padding:22px;
          margin:0;
          color:#111827;
        }
        .wrap{
          max-width:700px;
          margin:0 auto;
          background:#ffffff;
          padding:24px;
          border-radius:16px;
          box-shadow:0 20px 45px rgba(0,0,0,0.15);
        }
        h1{
          margin-top:0;
          margin-bottom:12px;
        }
        h2{
          margin-top:18px;
          margin-bottom:8px;
          font-size:18px;
        }
        .btn-back{
          margin-top:20px;
          padding:10px 18px;
          border:none;
          border-radius:999px;
          background:#0f172a;
          color:#ffffff;
          font-weight:600;
          cursor:pointer;
          margin-right:8px;
        }
        p{
          font-size:14px;
          line-height:1.4;
        }
      </style>
    </head>
    <body>
      <div class="wrap">
        <h1>Detalle de juicio</h1>
        <p><strong>Fecha:</strong> ${limpiarTexto(d.fecha)}</p>
        <p><strong>Hora:</strong> ${limpiarTexto(d.hora)}</p>
        <p><strong>Lugar / sala:</strong> ${limpiarTexto(d.lugar)}</p>
        <p><strong>Notas:</strong><br>${limpiarTexto(d.notas).replace(/\\n/g,"<br>")}</p>

        ${adjuntoHtml}

        <button class="btn-back" onclick="window.location.href='juicios.html'">Volver a juicios</button>
        <button class="btn-back" onclick="window.location.href='index.html'">Volver a index</button>
        <button class="btn-back" onclick="if(window.opener && window.opener.editarJuicio){ window.opener.editarJuicio('${clave}'); } window.close();">
          Editar juicio
        </button>
      </div>
    </body>
    </html>
  `);
  vent.document.close();
}

/* Funcion para editar un juicio existente: carga datos en el formulario */
function editarJuicio(clave){
  const d = JSON.parse(localStorage.getItem(clave));
  if(!d) return;

  claveActual = clave;

  document.getElementById("fechaJuicio").value = d.fecha || "";
  document.getElementById("horaJuicio").value = d.hora || "";
  document.getElementById("lugar").value = d.lugar || "";
  document.getElementById("notas").value = d.notas || "";
  // El adjunto ya guardado se mantiene en localStorage;
  // el campo file no se puede rellenar por seguridad del navegador.

  window.scrollTo(0,0);
  alert("Edicion activada. Modifica los datos y pulsa GUARDAR para actualizar el juicio.");
}

/* Imprimir TODOS los juicios */
function imprimirJuicios(){
  const juicios = [];

  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith("juicio_")){
      const d = JSON.parse(localStorage.getItem(k));
      if(d) juicios.push(d);
    }
  }

  if(juicios.length === 0){
    alert("No hay juicios para imprimir.");
    return;
  }

  juicios.sort((a,b)=>{
    const fa = (a.fecha||"") + (a.hora||"");
    const fb = (b.fecha||"") + (b.hora||"");
    return fa < fb ? -1 : fa > fb ? 1 : 0;
  });

  let contenido = "";
  juicios.forEach(d=>{
    contenido += `
      <div class="juicio">
        <p><strong>Fecha:</strong> ${limpiarTexto(d.fecha)} ${limpiarTexto(d.hora)}</p>
        <p><strong>Lugar / sala:</strong> ${limpiarTexto(d.lugar)}</p>
        <p><strong>Notas:</strong><br>${limpiarTexto(d.notas).replace(/\\n/g,"<br>")}</p>
      </div>
      <hr>
    `;
  });

  const vent = window.open("","_blank");
  vent.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Agenda ErNE del policia</title>
      <style>
        body{
          font-family:system-ui,arial;
          color:#111827;
          padding:20px;
          background:#f3f4f6;
        }
        h1{margin-bottom:8px;}
        .sub{
          font-size:13px;
          margin-bottom:20px;
          color:#4b5563;
        }
        .juicio{
          margin-bottom:16px;
          font-size:14px;
          line-height:1.4;
        }
        hr{
          border:none;
          border-bottom:1px solid #d1d5db;
          margin:16px 0;
        }
        .btn-back{
          margin-top:20px;
          padding:10px 18px;
          border-radius:999px;
          border:none;
          background:#0f172a;
          color:#f9fafb;
          font-weight:600;
          cursor:pointer;
          margin-right:8px;
        }
        @media print{
          .btn-back{display:none;}
        }
      </style>
    </head>
    <body>
      <h1>Agenda ErNE del policia</h1>
      <div class="sub">Juicios guardados en la agenda personal.</div>

      ${contenido}

      <button class="btn-back" onclick="window.location.href='juicios.html'">Volver a juicios</button>
      <button class="btn-back" onclick="window.print()">Guardar como PDF</button>
    </body>
    </html>
  `);
  vent.document.close();
}

cargarLista();
</script>

<!-- Boton VOLVER A INDEX al final de la pagina principal -->
<button class="volver" onClick="window.location.href='index.html'">
 Panel
</button>

</body>
</html>
