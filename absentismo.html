<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Er.N.E. PRODUCTIVIDADES</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #050816;
      --card-bg: rgba(15, 23, 42, 0.95);
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.2);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: rgba(148, 163, 184, 0.25);
      --radius-xl: 18px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.6);
      --blur: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #1d2333 0, transparent 55%),
        radial-gradient(circle at bottom right, #020617 0, transparent 55%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      padding: 24px;
    }

    .shell {
      width: 100%;
      max-width: 900px;
      background: radial-gradient(circle at top, rgba(148, 163, 184, 0.1), transparent 60%);
      border-radius: 26px;
      padding: 1px;
      position: relative;
      overflow: hidden;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(34, 197, 94, 0.1), transparent 55%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .panel {
      position: relative;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 24px;
      padding: 28px 26px 26px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(var(--blur));
      z-index: 1;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 640px) {
      body {
        align-items: flex-start;
        padding-top: 12px;
      }

      .panel {
        padding: 20px 18px 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card-link {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      padding: 18px 16px;
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at top left, rgba(148, 163, 184, 0.18), transparent 70%),
        var(--card-bg);
      border: 1px solid rgba(148, 163, 184, 0.35);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      cursor: pointer;
      transition: transform .16s;
    }

    .card-link:hover {
      transform: translateY(-3px);
      border-color: rgba(34, 197, 94, 0.85);
    }

    /* Botón rojo */
    .panel-button {
      display:inline-block;
      background:#ef4444;
      color:#fef2f2;
      text-decoration:none;
      font-weight:700;
      padding:12px 36px;
      border-radius:999px;
      font-size:14px;
      box-shadow:0 6px 18px rgba(239,68,68,0.45);
      transition:transform .15s ease, box-shadow .15s ease;
      margin-top:32px;
    }

    .panel-button:hover {
      transform:translateY(-2px);
      box-shadow:0 10px 28px rgba(239,68,68,0.55);
    }

  </style>
</head>
<body>
  <div class="shell">
    <div class="panel">

      <header class="panel-header">
        <div class="title-block">
          <div class="eyebrow">
            <span class="eyebrow-dot"></span>
            Accesos internos
          </div>
          <h1>Calculo de productividades</h1>
          <p class="subtitle">Periodo 2021/ 2024, con detalle anual de cada ejercicio.</p>
        </div>
        <div><img src="euskalpolizia txiki.jpg" width="130" height="50"></div>
      </header>

      <main class="grid">

        <a class="card-link" href="nocturnos.html">
          <div class="card-main">
            <div class="card-title">Calculo nocturnos y festivos</div>
            NOCTURNOS y FESTIVOS
          </div>
        </a>

        <a class="card-link" href="absentismo.html">
          <div class="card-main">
            <div class="card-title">Calculo de productividades absentismo</div>
            BIMESTRAL / NORMALIZADO — TRIMESTRAL / FLEXIBLE
          </div>
        </a>

      </main>

      <!-- 🔴 BOTÓN ROJO CENTRADO DEBAJO DE TODOS LOS BANNERS -->
      <div style="text-align:center;">
        <a href="index.html" class="panel-button">Panel</a>
      </div>

    </div>
  </div>
</body>
</html>
