<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herramientas de cálculo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 24px;
    background: #eef1f4;
    font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif;
}

.buttons {
    width: 100%;
    max-width: 920px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 32px;
}

.button {
    --c1: #2a6aa8;
    --c2: #153f6b;
    --glow: 31, 78, 121;
    position: relative;
    overflow: hidden;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 32px;
    border-radius: 14px;
    color: #fff;
    text-decoration: none;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .02em;
    background: linear-gradient(145deg, var(--c1), var(--c2));
    box-shadow:
        0 2px 4px rgba(var(--glow), .25),
        0 12px 24px rgba(var(--glow), .30),
        0 28px 48px rgba(20, 33, 46, .18),
        inset 0 1px 0 rgba(255, 255, 255, .25);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s ease;
}

.button.carrera {
    --c1: #25908f;
    --c2: #115156;
    --glow: 27, 107, 111;
}

/* barrido de luz */
.button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -80%;
    width: 50%;
    height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.28), transparent);
    transform: skewX(-20deg);
    transition: left .7s ease;
}

/* halo suave */
.button::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.22), transparent 60%);
    opacity: 0;
    transition: opacity .3s ease;
}

.button > * { position: relative; z-index: 1; }

.icon {
    width: 76px;
    height: 76px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, .16);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.3), 0 6px 14px rgba(0,0,0,.18);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), background .3s ease;
}

.icon svg { width: 38px; height: 38px; }

.button:hover {
    transform: translateY(-8px);
    box-shadow:
        0 4px 8px rgba(var(--glow), .30),
        0 20px 36px rgba(var(--glow), .38),
        0 44px 70px rgba(20, 33, 46, .26),
        inset 0 1px 0 rgba(255, 255, 255, .35);
}

.button:hover::before { left: 140%; }
.button:hover::after  { opacity: 1; }
.button:hover .icon   { transform: scale(1.12); background: rgba(255,255,255,.26); }

.button:active {
    transform: translateY(-2px) scale(.985);
    transition-duration: .1s;
}

.button:focus-visible {
    outline: 3px solid #14212e;
    outline-offset: 4px;
}

@media (max-width: 650px) {
    .buttons { grid-template-columns: 1fr; gap: 24px; }
    .button { min-height: 170px; font-size: 20px; }
}

@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
}
.carrera-menu { position: relative; align-self: start; min-width: 0; }
summary.carrera { cursor: pointer; list-style: none; }
summary.carrera::-webkit-details-marker { display: none; }

.carrera-options {
    position: absolute;
    top: 100%;
    inset-inline: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 8px;
}

.carrera-options a {
    flex: 1 1 auto;
    padding: 10px 12px;
    border-radius: 10px;
    background: #115156;
    color: #fff;
    text-align: center;
    text-decoration: none;
}

.carrera-options a:hover, .carrera-options a:focus-visible { background: #237775; }

@media (max-width: 650px) {
    .carrera-options { position: static; }
}
</style>
<link rel="icon" type="image/x-icon" href="IA/TRESNAK/ep.ico">
</head>
<body>

<nav class="buttons">

    <a href="baremo.html" class="button baremo">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
        </span>
        Baremo de méritos
    </a>

    <details class="carrera-menu">
    <summary class="button carrera">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20v-5h4v5M10 20v-9h4v9M15 20V7h4v13"/></svg>
        </span>
        Carrera profesional
    </summary>
        <div class="carrera-options">
            <a href="carrera_encuadra.html">Encuadramiento</a>
            <a href="carrera_eva.html">Evaluación</a>
        </div>
    </details>

</nav>

<script>
const carreraMenu = document.querySelector('.carrera-menu');
carreraMenu.addEventListener('pointerenter', event => {
    if (event.pointerType === 'mouse') carreraMenu.open = true;
});
carreraMenu.addEventListener('pointerleave', event => {
    if (event.pointerType === 'mouse' && !carreraMenu.contains(document.activeElement)) {
        carreraMenu.open = false;
    }
});
carreraMenu.addEventListener('keydown', event => {
    if (event.key === 'Escape' && carreraMenu.open) {
        carreraMenu.open = false;
        carreraMenu.querySelector('summary').focus();
    }
});
</script>
</body>
</html>
